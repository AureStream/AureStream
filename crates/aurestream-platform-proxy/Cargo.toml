[package]
name = "aurestream-platform-proxy"
version = "0.1.0"
edition = "2021"
description = "OS system proxy set/clear for AureStream MVP (no TUN)"

[dependencies]
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_NetworkManagement_Rras",
] }
