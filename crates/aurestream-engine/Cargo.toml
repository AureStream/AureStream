[package]
name = "aurestream-engine"
version = "0.1.0"
edition = "2021"
description = "Engine trait, state machine, and Xray sidecar runner for AureStream MVP"

[dependencies]
aurestream-config = { path = "../aurestream-config" }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "io-util", "sync"] }

[dev-dependencies]
tempfile = "3"
