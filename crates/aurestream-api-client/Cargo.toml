[package]
name = "aurestream-api-client"
version = "0.1.0"
edition = "2021"
description = "HTTP client for AureStream Worker API (auth + subscriptions)"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
