name: Build desktop bundles

on:
  workflow_dispatch:
    inputs:
      linux-x64:
        description: "Build Linux x64"
        type: boolean
        default: true
      windows-x64:
        description: "Build Windows x64"
        type: boolean
        default: true
      macos-aarch64:
        description: "Build macOS ARM64"
        type: boolean
        default: true
      macos-x64:
        description: "Build macOS x64"
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: gen
        shell: bash
        run: |
          full='[
            {"name":"linux-x64","os":"ubuntu-22.04","rust_target":"x86_64-unknown-linux-gnu"},
            {"name":"windows-x64","os":"windows-2025","rust_target":"x86_64-pc-windows-msvc"},
            {"name":"macos-aarch64","os":"macos-latest","rust_target":"aarch64-apple-darwin"},
            {"name":"macos-x64","os":"macos-15-intel","rust_target":"x86_64-apple-darwin"}
          ]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix=$(echo "$full" | jq -c \
              --arg linux_x64 "${{ github.event.inputs.linux-x64 }}" \
              --arg windows_x64 "${{ github.event.inputs.windows-x64 }}" \
              --arg macos_aarch64 "${{ github.event.inputs.macos-aarch64 }}" \
              --arg macos_x64 "${{ github.event.inputs.macos-x64 }}" \
              '{include: [.[] | select(
                (.name == "linux-x64" and $linux_x64 == "true") or
                (.name == "windows-x64" and $windows_x64 == "true") or
                (.name == "macos-aarch64" and $macos_aarch64 == "true") or
                (.name == "macos-x64" and $macos_x64 == "true")
              )]}')
          else
            matrix=$(echo "$full" | jq -c '{include: .}')
          fi
          echo "matrix=$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install NSIS and 7-Zip (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis 7zip -y

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          # pnpm-lock.yaml is gitignored in this repo; key off package.json instead.
          key: ${{ runner.os }}-pnpm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true

      - name: Install pnpm dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Xray sidecar and geo databases
        env:
          AURESTREAM_RUST_TARGET: ${{ matrix.rust_target }}
        run: pnpm download-binaries

      - name: Build Windows tun-service sidecar
        if: runner.os == 'Windows'
        env:
          AURESTREAM_RUST_TARGET: ${{ matrix.rust_target }}
        run: pnpm build-tun

      - name: Import AureStream code-signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          AURESTREAM_CODESIGN_P12_BASE64: ${{ secrets.AURESTREAM_CODESIGN_P12_BASE64 }}
          AURESTREAM_CODESIGN_P12_PASSWORD: ${{ secrets.AURESTREAM_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/aurestream-codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$AURESTREAM_CODESIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/aurestream-codesign.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/aurestream-codesign.p12" -k "$KEYCHAIN_PATH" -P "$AURESTREAM_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign -A
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[\" ]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Self-signed cert: `security find-identity -p codesigning` (which
          # tauri-action's own signing step uses to resolve the identity)
          # only lists identities trusted for the codeSign policy, even
          # though plain `codesign --sign` works without this. Extract the
          # cert and trust it locally so both paths agree.
          openssl pkcs12 -in "$RUNNER_TEMP/aurestream-codesign.p12" -clcerts -nokeys \
            -passin "pass:$AURESTREAM_CODESIGN_P12_PASSWORD" \
            -out "$RUNNER_TEMP/aurestream-codesign.crt"
          security add-trusted-cert -p codeSign -r trustRoot -k "$KEYCHAIN_PATH" "$RUNNER_TEMP/aurestream-codesign.crt"
          rm -f "$RUNNER_TEMP/aurestream-codesign.crt"
          rm -f "$RUNNER_TEMP/aurestream-codesign.p12"

      - name: Build macOS privileged helper
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm pre-bundle

      - name: Build Linux tun-helper
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          cargo build -p aurestream-platform-tun --bin aurestream-tun-helper --release --target ${{ matrix.rust_target }}
          mkdir -p target/release
          cp "src-tauri/target/${{ matrix.rust_target }}/release/aurestream-tun-helper" target/release/aurestream-tun-helper

      - name: Verify staged sidecar for matrix target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="src-tauri/binaries/aurestream-core-${{ matrix.rust_target }}.exe"
            tun="src-tauri/binaries/tun-service-${{ matrix.rust_target }}.exe"
            test -f "$bin"
            test -f "$tun"
            # wintun.dll required for Xray TUN on Windows
            test -f src-tauri/resources/wintun.dll || test -f src-tauri/binaries/wintun.dll
            ls -la "$bin" "$tun" src-tauri/resources/geoip.dat src-tauri/resources/geosite.dat
            ls -la src-tauri/resources/wintun.dll src-tauri/binaries/wintun.dll 2>/dev/null || true
          else
            bin="src-tauri/binaries/aurestream-core-${{ matrix.rust_target }}"
            test -f "$bin"
            test -f src-tauri/resources/geoip.dat
            test -f src-tauri/resources/geosite.dat
            ls -la "$bin" src-tauri/resources/geoip.dat src-tauri/resources/geosite.dat
          fi

      - name: Check and test frontend + workspace crates
        run: |
          pnpm build
          pnpm test
          cargo check --workspace --target ${{ matrix.rust_target }}
          cargo test --workspace --target ${{ matrix.rust_target }}
      - name: Work around ldd crash on static Xray binary (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # aurestream-core (Xray-core) is a statically-linked Go binary.
          # linuxdeploy runs `ldd` on every ELF in the AppDir; ldd exits 1 on
          # static binaries and linuxdeploy throws. Wrap ldd for static ELFs.
          sudo cp /usr/bin/ldd /usr/bin/ldd.orig
          sudo cp scripts/ldd-static-safe.sh /usr/bin/ldd
          sudo chmod +x /usr/bin/ldd

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          # Tauri's macOS bundler leaves the .app completely unsigned (not
          # even ad-hoc) when this is unset — which is what shipped in
          # earlier releases and is why SMJobBless rejected the installed
          # app with error 4 (the OS then lazily ad-hoc-signs it on first
          # launch with a random per-machine identifier, never matching
          # "com.root.aurestream"). Sign with the shared "AureStream Code
          # Signing" cert (imported by the previous step) so codesign binds
          # the app's actual bundle identifier, matching what the helper's
          # SMAuthorizedClients / the app's SMPrivilegedExecutables require.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (secrets.APPLE_SIGNING_IDENTITY || 'AureStream Code Signing') || '' }}
        with:
          args: >-
            --target ${{ matrix.rust_target }}
            --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AureStream-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg
          if-no-files-found: warn

      - name: Prepare Release Assets
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          while IFS= read -r file; do
            name="$(basename "$file")"
            if [[ "${{ matrix.name }}" == macos-* && "$name" == *.app.tar.gz* ]]; then
              name="${{ matrix.name }}-$name"
            fi
            cp "$file" "release-files/$name"
          done < <(find src-tauri/target/${{ matrix.rust_target }}/release/bundle -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o \
            -name '*.sig' -o -name '*.AppImage.tar.gz' -o \
            -name '*.app.tar.gz' -o -name '*.zip' \
          \) -print)
          ls -la release-files/

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-update:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Release updater file
        run: node scripts/updater.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater manifest branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: updater
          publish_dir: ./updater-manifest
          force_orphan: true
          commit_message: "chore: publish updater manifest for ${{ github.event.release.tag_name }}"

      - name: Purge jsDelivr updater cache
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@updater/latest.json"
