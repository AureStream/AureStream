name: Build Windows x64

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TARGET: x86_64-pc-windows-msvc
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

jobs:
  build-windows-x64:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install NSIS and 7-Zip
        run: choco install nsis 7zip -y

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true

      - name: Install pnpm dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download external binaries and databases
        run: pnpm download-binaries

      - name: Build Windows TUN service
        run: pnpm build-tun --release --target ${{ env.RUST_TARGET }}

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ env.RUST_TARGET }} --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AureStream-windows-x64
          path: |
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Prepare release assets
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p release-files
          find "src-tauri/target/${RUST_TARGET}/release/bundle" -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.sig' -o -name '*.zip' \
          \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-update:
    needs: build-windows-x64
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Release updater file
        run: node scripts/updater.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
