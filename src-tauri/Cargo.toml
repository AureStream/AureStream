[package]
name = "aurestream"
version = "0.3.5"
description = "AureStream v2 desktop shell"
authors = ["you"]
edition = "2021"

[lib]
name = "aurestream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
