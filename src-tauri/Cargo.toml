[package]
name = "aurestream"
version = "0.3.5"
description = "AureStream v2 desktop shell"
authors = ["you"]
edition = "2021"

[lib]
name = "aurestream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aurestream-api-client = { path = "../crates/aurestream-api-client" }
aurestream-config = { path = "../crates/aurestream-config" }
aurestream-engine = { path = "../crates/aurestream-engine" }
aurestream-platform-proxy = { path = "../crates/aurestream-platform-proxy" }
aurestream-platform-tun = { path = "../crates/aurestream-platform-tun" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
